---
# Traffic Camera Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-camera
  namespace: smart-city
  labels:
    app: traffic-camera
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traffic-camera
  template:
    metadata:
      labels:
        app: traffic-camera
    spec:
      containers:
      - name: traffic-camera
        image: python:3.9-slim
        command: ["/bin/sh", "-c"]
        args:
          - "pip install flask==3.0.0 && python /app/app.py"
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        - name: PORT
          value: "5000"
        volumeMounts:
        - name: code
          mountPath: /app
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: code
        configMap:
          name: traffic-camera-code

---
# Traffic Camera Service
apiVersion: v1
kind: Service
metadata:
  name: traffic-camera-service
  namespace: smart-city
  labels:
    app: traffic-camera
spec:
  selector:
    app: traffic-camera
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
  type: ClusterIP

