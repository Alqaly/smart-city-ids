apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-camera
  namespace: smart-city
  labels:
    app: traffic-camera
    tier: iot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traffic-camera
  template:
    metadata:
      labels:
        app: traffic-camera
        tier: iot
    spec:
      containers:
      - name: traffic-camera
        image: traffic-camera:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-camera-service
  namespace: smart-city
spec:
  selector:
    app: traffic-camera
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
  type: ClusterIP
