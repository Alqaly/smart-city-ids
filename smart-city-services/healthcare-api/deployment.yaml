apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-api
  namespace: smart-city
  labels:
    app: healthcare-api
    tier: critical
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcare-api
  template:
    metadata:
      labels:
        app: healthcare-api
        tier: critical
    spec:
      containers:
      - name: healthcare-api
        image: healthcare-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5001
        env:
        - name: PORT
          value: "5001"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-api-service
  namespace: smart-city
spec:
  selector:
    app: healthcare-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5001
  type: ClusterIP
