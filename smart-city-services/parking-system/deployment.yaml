apiVersion: apps/v1
kind: Deployment
metadata:
  name: parking-system
  namespace: smart-city
  labels:
    app: parking-system
    tier: public
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parking-system
  template:
    metadata:
      labels:
        app: parking-system
        tier: public
    spec:
      containers:
      - name: parking-system
        image: parking-system:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5002
        env:
        - name: PORT
          value: "5002"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: parking-system-service
  namespace: smart-city
spec:
  selector:
    app: parking-system
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5002
  type: ClusterIP
