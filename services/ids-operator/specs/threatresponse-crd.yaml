apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: threatresponses.ids.smartcity.local
spec:
  group: ids.smartcity.local
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                alertId:
                  type: string
                severity:
                  type: integer
                actions:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                appliedActions:
                  type: array
                  items:
                    type: string
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: threatresponses
    singular: threatresponse
    kind: ThreatResponse
    shortNames:
      - tr
