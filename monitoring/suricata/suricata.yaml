# Suricata Configuration for Smart City IDS
%YAML 1.1
---

# Network interfaces
af-packet:
  - interface: eth0
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes

# Logging
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /var/log/suricata/eve.json
      types:
        - alert:
            payload: yes
            payload-buffer-size: 4kb
            payload-printable: yes
            packet: yes
            metadata: yes
            http: yes
            tls: yes
            ssh: yes
            smtp: yes
            dnp3: yes
            ftp: yes
            rdp: yes
            nfs: yes
            smb: yes
            tftp: yes
            ikev2: yes
            krb5: yes
            snmp: yes
            sip: yes
            dhcp: yes
            rfb: yes
            mqtt: yes
        - anomaly:
            enabled: yes
        - http:
            extended: yes
        - dns:
            enabled: yes
        - tls:
            extended: yes
        - files:
            force-magic: yes
        - drop:
            enabled: yes
        - stats:
            enabled: yes
            totals: yes
            threads: yes

# Rule files
default-rule-path: /var/lib/suricata/rules
rule-files:
  - emerging-attack_response.rules
  - emerging-dos.rules
  - emerging-exploit.rules
  - emerging-malware.rules
  - emerging-scan.rules
  - emerging-web_server.rules
  - emerging-web_client.rules

# Detection settings
detect:
  profile: high
  custom-values:
    toclient-groups: 3
    toserver-groups: 25

# Stream settings
stream:
  memcap: 64mb
  checksum-validation: yes
  inline: auto
  reassembly:
    memcap: 256mb
    depth: 1mb
    toserver-chunk-size: 2560
    toclient-chunk-size: 2560

# Host settings
host:
  hash-size: 4096
  prealloc: 1000
  memcap: 32mb

# App layer protocols
app-layer:
  protocols:
    http:
      enabled: yes
      memcap: 64mb
    tls:
      enabled: yes
      detection-ports:
        dp: 443
    dns:
      tcp:
        enabled: yes
        detection-ports:
          dp: 53
      udp:
        enabled: yes
        detection-ports:
          dp: 53

# Performance tuning
threading:
  set-cpu-affinity: no
  cpu-affinity:
    - management-cpu-set:
        cpu: [ 0 ]
    - receive-cpu-set:
        cpu: [ 0 ]
    - worker-cpu-set:
        cpu: [ "all" ]

# Logging levels
logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
    - file:
        enabled: yes
        level: info
        filename: /var/log/suricata/suricata.log
