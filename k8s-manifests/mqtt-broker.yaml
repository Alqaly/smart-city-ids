apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-broker
  namespace: smart-city
  labels:
    app: mqtt-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-broker
  template:
    metadata:
      labels:
        app: mqtt-broker
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2
        ports:
        - containerPort: 1883
        - containerPort: 9001
        volumeMounts:
        - name: mosquitto-config
          mountPath: /mosquitto/config
      volumes:
      - name: mosquitto-config
        configMap:
          name: mosquitto-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: smart-city
data:
  mosquitto.conf: |
    allow_anonymous true
    listener 1883
    listener 9001
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-broker
  namespace: smart-city
  labels:
    app: mqtt-broker
spec:
  selector:
    app: mqtt-broker
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
  - name: ws
    port: 9001
    targetPort: 9001
