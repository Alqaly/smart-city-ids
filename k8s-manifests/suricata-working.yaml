apiVersion: v1
kind: ConfigMap
metadata:
  name: suricata-config
  namespace: suricata-system
data:
  suricata.yaml: |
    %YAML 1.1
    ---
    vars:
      address-groups:
        HOME_NET: "[10.42.0.0/16]"
        EXTERNAL_NET: "!$HOME_NET"
        HTTP_SERVERS: "$HOME_NET"
        SMTP_SERVERS: "$HOME_NET"
        SQL_SERVERS: "$HOME_NET"
        DNS_SERVERS: "$HOME_NET"
        TELNET_SERVERS: "$HOME_NET"
        AIM_SERVERS: "$EXTERNAL_NET"
        DC_SERVERS: "$HOME_NET"
        DNP3_SERVER: "$HOME_NET"
        DNP3_CLIENT: "$HOME_NET"
        MODBUS_CLIENT: "$HOME_NET"
        MODBUS_SERVER: "$HOME_NET"
        ENIP_CLIENT: "$HOME_NET"
        ENIP_SERVER: "$HOME_NET"
      port-groups:
        HTTP_PORTS: "80"
        SHELLCODE_PORTS: "!80"
        ORACLE_PORTS: 1521
        SSH_PORTS: 22
        DNP3_PORTS: 20000
        MODBUS_PORTS: 502
        FILE_DATA_PORTS: "[$HTTP_PORTS,110,143]"
        FTP_PORTS: 21
        GENEVE_PORTS: 6081
        VXLAN_PORTS: 4789
        TEREDO_PORTS: 3544
    
    outputs:
      - eve-log:
          enabled: yes
          filetype: regular
          filename: /var/log/suricata/eve.json
          types:
            - alert
    
    default-log-dir: /var/log/suricata/
    default-rule-path: /var/lib/suricata/rules
    rule-files:
      - local.rules
    
    logging:
      default-log-level: notice
    
    af-packet:
      - interface: eth0
        cluster-id: 99
        cluster-type: cluster_flow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suricata
  namespace: suricata-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suricata
  template:
    metadata:
      labels:
        app: suricata
    spec:
      containers:
      - name: suricata
        image: jasonish/suricata:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /var/log/suricata /var/lib/suricata/rules
            echo 'alert tcp any any -> any any (msg:"TEST ALERT - Suricata Running"; sid:1000001; rev:1;)' > /var/lib/suricata/rules/local.rules
            echo 'alert icmp any any -> any any (msg:"ICMP Packet Detected"; sid:1000002; rev:1;)' >> /var/lib/suricata/rules/local.rules
            /usr/bin/suricata -c /etc/suricata/suricata.yaml -i eth0 -v
        volumeMounts:
        - name: config
          mountPath: /etc/suricata
        - name: logs
          mountPath: /var/log/suricata
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: suricata-config
      - name: logs
        emptyDir: {}
