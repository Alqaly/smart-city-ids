apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  # Tells Grafana where to find dashboards (auto-loaded on startup)
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'Smart City IDS'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards
  
  # Configures Prometheus datasource (auto-created on startup)
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus.monitoring.svc.cluster.local:9090
      access: proxy
      isDefault: true
      jsonData:
        httpMethod: GET
        cacheTimeout: '60'

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  # Dashboard files auto-loaded by provisioning (see above)
  # Simply list them here - Grafana discovers them on startup
  ids-dashboard.json: '{}' # Will be populated by script during build
  production-dashboard.json: '{}' # Will be populated by script during build
  soc-overview-dashboard.json: '{}' # Will be populated by script during build
  llm-performance-dashboard.json: '{}' # Will be populated by script during build
  iot-load-dashboard.json: '{}' # Will be populated by script during build
