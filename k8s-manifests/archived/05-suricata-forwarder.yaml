---
apiVersion: v1
kind: ConfigMap
metadata:
  name: suricata-forwarder-script
  namespace: suricata-system
data:
  forwarder.py: |
    #!/usr/bin/env python3
    """
    Suricata Alert Forwarder
    Tails eve.json and forwards alerts to IDS API
    """
    import json
    import time
    import logging
    import requests
    from pathlib import Path
    
    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)
    
    EVE_LOG = "/var/log/suricata/eve.json"
    IDS_API = "http://ids-api-service.smart-city:8000/api/alerts/internal"
    
    def tail_and_forward():
        """Tail eve.json and forward alerts"""
        logger.info(f"Starting Suricata forwarder...")
        logger.info(f"Watching: {EVE_LOG}")
        logger.info(f"Forwarding to: {IDS_API}")
        
        # Wait for log file
        while not Path(EVE_LOG).exists():
            logger.info("Waiting for eve.json...")
            time.sleep(5)
        
        with open(EVE_LOG, 'r') as f:
            # Go to end of file
            f.seek(0, 2)
            
            while True:
                line = f.readline()
                
                if line:
                    try:
                        event = json.loads(line)
                        
                        # Only forward alerts
                        if event.get('event_type') == 'alert':
                            logger.info(f"Alert: {event.get('alert', {}).get('signature')}")
                            
                            # Forward to IDS
                            try:
                                response = requests.post(
                                    IDS_API,
                                    json=event,
                                    timeout=5
                                )
                                
                                if response.status_code == 200:
                                    logger.info("✅ Alert forwarded")
                                else:
                                    logger.warning(f"Failed to forward: {response.status_code}")
                                    
                            except Exception as e:
                                logger.error(f"Forward error: {e}")
                    
                    except json.JSONDecodeError:
                        pass
                else:
                    time.sleep(0.1)
    
    if __name__ == "__main__":
        tail_and_forward()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suricata-forwarder
  namespace: suricata-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suricata-forwarder
  template:
    metadata:
      labels:
        app: suricata-forwarder
    spec:
      containers:
      - name: forwarder
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install --no-cache-dir requests
            python3 /scripts/forwarder.py
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: suricata-logs
          mountPath: /var/log/suricata
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: scripts
        configMap:
          name: suricata-forwarder-script
      - name: suricata-logs
        hostPath:
          path: /var/log/suricata
