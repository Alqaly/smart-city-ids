# =============================================================================
# Falco Helm Values - Smart City IDS
# JSON output enabled by default for integration with IDS forwarder
# =============================================================================
# Install with: helm install falco falcosecurity/falco -n falco-system -f falco-values.yaml
# =============================================================================

# Enable JSON output (REQUIRED for forwarder integration)
falco:
  json_output: true
  json_include_output_property: true
  json_include_output_fields_property: true
  json_include_tags_property: true
  watch_config_files: false
  log_stderr: true
  log_syslog: false
  log_level: info

# Resource limits optimized for single-node K3s (8GB RAM)
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Use modern eBPF driver (works without kernel headers)
driver:
  enabled: true
  kind: modern_ebpf

# Enable container metadata enrichment
collectors:
  enabled: true
  kubernetes:
    enabled: true

# Disable unused outputs to reduce overhead
falcosidekick:
  enabled: false

# Disable metrics server (we use forwarder → IDS API → Prometheus)
webserver:
  enabled: true
  prometheus_metrics_enabled: false

# Smart City IDS - Custom detection rules
# Applied via ConfigMap falco-new key smart-city.yaml mounted at /etc/falco/rules.d/
customRules:
  smart-city.yaml: |-
    # ==========================================================================
    # Smart City IDS - Custom Falco Rules
    # Covers: container escapes, sensitive file reads, unexpected exec, IoT abuse,
    #         privilege escalation, crypto mining, data exfiltration indicators
    # ==========================================================================

    - rule: Smart City - Shell Spawned in IDS API Container
      desc: A shell was directly executed inside the IDS API container (potential RCE)
      condition: >
        spawned_process and container and
        proc.name in (shell_binaries) and
        container.name = "ids-api"
      output: >
        Shell spawned in IDS API container
        (user=%user.name shell=%proc.name parent=%proc.pname cmdline=%proc.cmdline
        container=%container.name image=%container.image.repository)
      priority: CRITICAL
      tags: [smart-city, container, shell, T1059]

    - rule: Smart City - Unexpected Outbound Connection from IoT Simulator
      desc: IoT simulator pod opened an unexpected outbound TCP connection
      condition: >
        outbound and container and
        container.name contains "iot" and
        not fd.sport in (8883, 1883, 443, 80)
      output: >
        Unexpected outbound connection from IoT pod
        (container=%container.name image=%container.image.repository
        dest=%fd.rip:%fd.rport proto=%fd.l4proto user=%user.name)
      priority: WARNING
      tags: [smart-city, iot, network, T1041]

    - rule: Smart City - Sensitive Env File Read
      desc: Process read a file that may contain secrets or credentials
      condition: >
        open_read and container and
        (fd.name contains "/.env" or fd.name contains "/etc/secret" or
         fd.name endswith ".key" or fd.name endswith ".pem") and
        not fd.name contains "cacert.pem" and
        not fd.name contains "/usr/lib" and
        not proc.name in (falco_binaries)
      output: >
        Sensitive file opened for reading
        (file=%fd.name user=%user.name proc=%proc.name parent=%proc.pname
        container=%container.name cmdline=%proc.cmdline)
      priority: WARNING
      tags: [smart-city, credentials, T1552]

    - rule: Smart City - Privilege Escalation via sudo
      desc: sudo or su called inside a container
      condition: >
        spawned_process and container and
        proc.name in (sudo, su, newgrp)
      output: >
        Privilege escalation attempt in container
        (proc=%proc.name parent=%proc.pname cmdline=%proc.cmdline
        container=%container.name user=%user.name)
      priority: ERROR
      tags: [smart-city, privilege-escalation, T1548]

    - rule: Smart City - Package Manager in Container
      desc: Package manager (apt/yum/pip) launched inside running container
      condition: >
        spawned_process and container and
        proc.name in (apt, apt-get, yum, pip, pip3, npm, curl, wget) and
        not container.name contains "installer" and
        not proc.pname in (falcoctl)
      output: >
        Package manager or downloader executed in container at runtime
        (proc=%proc.name parent=%proc.pname cmdline=%proc.cmdline
        container=%container.name image=%container.image.repository)
      priority: WARNING
      tags: [smart-city, runtime-integrity, T1072]

    - rule: Smart City - Crypto Mining Process
      desc: Known crypto mining binary detected in container
      condition: >
        spawned_process and container and
        proc.name in (xmrig, minerd, cpuminer, ethminer, nbminer, t-rex)
      output: >
        Crypto miner process spawned in container!
        (proc=%proc.name cmdline=%proc.cmdline container=%container.name
        user=%user.name image=%container.image.repository)
      priority: CRITICAL
      tags: [smart-city, crypto-mining, T1496]

    - rule: Smart City - Falco Forwarder Script Modified
      desc: The Falco forwarder shell script was written (integrity violation)
      condition: >
        open_write and container and
        fd.name contains "falco-forward"
      output: >
        Falco forwarder script was modified
        (file=%fd.name proc=%proc.name user=%user.name container=%container.name)
      priority: CRITICAL
      tags: [smart-city, integrity, T1565]

    - rule: Smart City - Database Accessed by Unexpected Process
      desc: PostgreSQL port accessed by a non-IDS process
      condition: >
        outbound and container and
        fd.rport = 5432 and
        not container.name in (ids-api, postgres)
      output: >
        Unexpected DB connection
        (container=%container.name proc=%proc.name dest=%fd.rip:%fd.rport
        user=%user.name)
      priority: ERROR
      tags: [smart-city, database, lateral-movement, T1210]

    - rule: Smart City - Container Escape Attempt
      desc: Process attempted to access host namespaces or mount host filesystem
      condition: >
        spawned_process and container and
        (proc.cmdline contains "nsenter" or
         proc.cmdline contains "chroot" or
         proc.cmdline contains "/proc/1/root" or
         proc.cmdline contains "mount /host")
      output: >
        Container escape attempt detected
        (proc=%proc.name cmdline=%proc.cmdline container=%container.name
        user=%user.name image=%container.image.repository)
      priority: CRITICAL
      tags: [smart-city, container-escape, T1611]

    - rule: Smart City - Kubernetes API Access from Container
      desc: Container process contacted the Kubernetes API server
      condition: >
        outbound and container and
        fd.rip = "10.43.0.1" and
        not container.name in (ids-api, falco, falco-forwarder) and
        not proc.pname in (falcoctl)
      output: >
        K8s API server contacted from container
        (container=%container.name proc=%proc.name dest=%fd.rip:%fd.rport
        user=%user.name cmdline=%proc.cmdline)
      priority: ERROR
      tags: [smart-city, k8s-api, T1552]

    - rule: Smart City - Reverse Shell Detected
      desc: Network connection spawned from a shell process (reverse shell indicator)
      condition: >
        outbound and container and
        proc.name in (bash, sh, dash, zsh, csh) and
        fd.l4proto = tcp
      output: >
        Possible reverse shell connection from container
        (proc=%proc.name parent=%proc.pname cmdline=%proc.cmdline
        container=%container.name dest=%fd.rip:%fd.rport user=%user.name)
      priority: CRITICAL
      tags: [smart-city, reverse-shell, T1059]

    - rule: Smart City - Kubernetes Secret Mount Read
      desc: Process read a file from a Kubernetes secret mount path
      condition: >
        open_read and container and
        fd.name startswith "/var/run/secrets/kubernetes.io" and
        not proc.name in (falco_binaries) and
        not container.name in (ids-api, prometheus, metrics-server,
         k8s-metacollector, forwarder, falco-forwarder,
         local-path-provisioner, coredns, traefik, svclb-traefik)
      output: >
        K8s secret mount read detected
        (file=%fd.name proc=%proc.name container=%container.name
        user=%user.name cmdline=%proc.cmdline)
      priority: ERROR
      tags: [smart-city, secret-theft, T1552]

    - rule: Smart City - Dynamic Code Execution in Container
      desc: Python or Node eval/exec used inside container (possible code injection)
      condition: >
        spawned_process and container and
        (proc.cmdline contains "python" and
         (proc.cmdline contains " -c " or proc.cmdline contains "exec(" or
          proc.cmdline contains "eval(")) and
        not container.name in (ids-api)
      output: >
        Dynamic code execution in container
        (proc=%proc.name cmdline=%proc.cmdline container=%container.name
        user=%user.name image=%container.image.repository)
      priority: ERROR
      tags: [smart-city, code-execution, T1059]

    - rule: Smart City - Log File Tampering
      desc: Write to system log files from unexpected process
      condition: >
        open_write and container and
        (fd.name startswith "/var/log" or fd.name contains "syslog" or
         fd.name contains ".log") and
        not proc.name in (python, python3, node, uvicorn, gunicorn, tee, logger)
      output: >
        Possible log tampering detected
        (file=%fd.name proc=%proc.name container=%container.name
        user=%user.name cmdline=%proc.cmdline)
      priority: WARNING
      tags: [smart-city, defense-evasion, T1070]

    - rule: Smart City - Binary Download in IoT Container
      desc: Download tool used in an IoT service container
      condition: >
        spawned_process and container and
        proc.name in (curl, wget, fetch) and
        (container.name contains "iot" or container.name contains "sensor" or
         container.name contains "parking" or container.name contains "traffic" or
         container.name contains "lighting" or container.name contains "healthcare")
      output: >
        Binary download detected in IoT/service container
        (proc=%proc.name cmdline=%proc.cmdline container=%container.name
        user=%user.name image=%container.image.repository)
      priority: ERROR
      tags: [smart-city, ingress-tool-transfer, T1105]

    - rule: Smart City - Cron or At Job Created in Container
      desc: Scheduled task persistence mechanism detected in container
      condition: >
        spawned_process and container and
        (proc.name in (crontab, at, atd) or
         (proc.name in (bash, sh) and proc.cmdline contains "cron"))
      output: >
        Cron/at job creation in container (persistence mechanism)
        (proc=%proc.name cmdline=%proc.cmdline container=%container.name
        user=%user.name)
      priority: ERROR
      tags: [smart-city, persistence, T1053]

    - rule: Smart City - Network Reconnaissance Tool
      desc: Network scanning or discovery tool executed in container
      condition: >
        spawned_process and container and
        proc.name in (nmap, masscan, nc, ncat, netcat, socat, dig, nslookup, host) and
        not container.name in (suricata)
      output: >
        Network recon tool executed in container
        (proc=%proc.name cmdline=%proc.cmdline container=%container.name
        user=%user.name image=%container.image.repository)
      priority: ERROR
      tags: [smart-city, reconnaissance, T1046]
