---
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-new
  namespace: falco-system
data:
  smart-city.yaml: |
    # Smart City IDS - Custom Falco Rules
    - rule: Smart City - Shell Spawned in IDS API Container
      desc: A shell was directly executed inside the IDS API container
      condition: >
        spawned_process and container and proc.name in (shell_binaries) and
        container.name = "ids-api"
      output: Shell spawned in IDS API container (user=%user.name shell=%proc.name cmdline=%proc.cmdline container=%container.name)
      priority: CRITICAL
      tags: [smart-city, container, shell, T1059]

    - rule: Smart City - Package Manager in Container
      desc: Package manager launched in running container at runtime
      condition: >
        spawned_process and container and
        proc.name in (apt, apt-get, yum, pip, pip3, wget, curl) and
        not proc.pname in (falcoctl)
      output: Package manager in container (proc=%proc.name cmdline=%proc.cmdline container=%container.name)
      priority: WARNING
      tags: [smart-city, runtime-integrity, T1072]

    - rule: Smart City - Crypto Mining Process
      desc: Known crypto mining binary detected in container
      condition: >
        spawned_process and container and
        proc.name in (xmrig, minerd, cpuminer, ethminer)
      output: Crypto miner process spawned! (proc=%proc.name cmdline=%proc.cmdline container=%container.name)
      priority: CRITICAL
      tags: [smart-city, crypto-mining, T1496]

    - rule: Smart City - Privilege Escalation via sudo
      desc: sudo called inside a container
      condition: spawned_process and container and proc.name in (sudo, su)
      output: Privilege escalation attempt (proc=%proc.name parent=%proc.pname container=%container.name user=%user.name)
      priority: ERROR
      tags: [smart-city, privilege-escalation, T1548]

    - rule: Smart City - Sensitive File Read
      desc: Process read a file that may contain secrets
      condition: >
        open_read and container and
        (fd.name contains "/.env" or fd.name endswith ".key" or
        (fd.name endswith ".pem" and not fd.name contains "/certifi/" and not fd.name contains "cacert.pem"))
      output: Sensitive file opened (file=%fd.name user=%user.name proc=%proc.name container=%container.name)
      priority: WARNING
      tags: [smart-city, credentials, T1552]

    - rule: Smart City - Control Tooling in IoT Service Container
      desc: Runtime network tooling executed inside an IoT workload container
      condition: >
        spawned_process and container and
        k8s.ns.name = "smart-city" and
        container.name in (traffic-camera, parking-system, env-sensor, street-lighting, healthcare-api) and
        proc.name in (curl, wget, nc, ncat, netcat, socat)
      output: Control tooling executed in IoT workload (proc=%proc.name cmdline=%proc.cmdline container=%container.name pod=%k8s.pod.name)
      priority: WARNING
      tags: [smart-city, runtime-integrity, T1105]

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-forwarder-script
  namespace: falco-system
data:
  forwarder.py: |
    #!/usr/bin/env python3
    import os
    import json
    import hashlib
    import requests
    import logging
    import threading
    import time
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from kubernetes import client, config, watch
    
    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)
    
    IDS_API = os.getenv("IDS_API_URL", "http://ids-api-service.smart-city:8000/api/alerts/internal")
    IDS_INTERNAL_ALERT_TOKEN = os.getenv("IDS_INTERNAL_ALERT_TOKEN", "")
    METRICS_PORT = 8080
    ALLOWED_NAMESPACES = {"smart-city", "monitoring", "falco-system"}
    SUPPRESSED_RULES = {
      "Contact K8S API Server From Container": {
        "containers": {"forwarder", "falco", "falco-forwarder", "falco-metacollector", "ids-api"}
      }
    }
    
    # Metrics
    alerts_forwarded = 0
    alerts_errors = 0
    last_forward_time = 0
    forwarder_up = 1
    recent_alert_hashes = {}
    DEDUP_TTL_SECONDS = 120

    def is_duplicate_alert(alert: dict) -> bool:
        now = time.time()
        for key, ts in list(recent_alert_hashes.items()):
            if now - ts > DEDUP_TTL_SECONDS:
                del recent_alert_hashes[key]

        output_fields = alert.get("output_fields", {}) or {}
        key = "|".join([
            str(alert.get("rule", "")),
            str(output_fields.get("container.name", "")),
          str(output_fields.get("k8s.pod.name", "")),
            str(output_fields.get("proc.name", "")),
            str(output_fields.get("fd.name", "")),
            str(alert.get("output", ""))[:120],
        ])
        digest = hashlib.md5(key.encode("utf-8", errors="ignore")).hexdigest()
        if digest in recent_alert_hashes:
            return True
        recent_alert_hashes[digest] = now
        return False
    
    class MetricsHandler(BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            pass  # Suppress HTTP logs
        
        def do_GET(self):
            if self.path == '/health':
                self.send_response(200)
                self.send_header('Content-type', 'text/plain')
                self.end_headers()
                self.wfile.write(b'OK')
            elif self.path == '/metrics':
                self.send_response(200)
                self.send_header('Content-type', 'text/plain')
                self.end_headers()
                metrics = f'''# HELP falco_forwarder_up Falco forwarder is running
    # TYPE falco_forwarder_up gauge
    falco_forwarder_up {forwarder_up}
    # HELP falco_forwarder_alerts_forwarded_total Total alerts forwarded
    # TYPE falco_forwarder_alerts_forwarded_total counter
    falco_forwarder_alerts_forwarded_total {alerts_forwarded}
    # HELP falco_forwarder_alerts_errors_total Total errors forwarding alerts
    # TYPE falco_forwarder_alerts_errors_total counter
    falco_forwarder_alerts_errors_total {alerts_errors}
    '''
                self.wfile.write(metrics.encode())
            else:
                self.send_response(404)
                self.end_headers()
    
    def run_metrics_server():
        server = HTTPServer(('0.0.0.0', METRICS_PORT), MetricsHandler)
        logger.info(f"Metrics server running on port {METRICS_PORT}")
        server.serve_forever()
    
    def forward_to_ids():
        global alerts_forwarded, alerts_errors, forwarder_up
        try:
            config.load_incluster_config()
            v1 = client.CoreV1Api()
            
            logger.info("Starting Falco → IDS forwarder...")
            
            # Wait for Falco pod
            while True:
                pods = v1.list_namespaced_pod(
                    namespace="falco-system",
                    label_selector="app.kubernetes.io/name=falco"
                )
                if pods.items:
                    break
                logger.info("Waiting for Falco pod...")
                time.sleep(5)
            
            falco_pod = pods.items[0].metadata.name
            logger.info(f"Monitoring: {falco_pod}")
            forwarder_up = 1
            
            w = watch.Watch()
            for line in w.stream(
                v1.read_namespaced_pod_log,
                name=falco_pod,
                namespace="falco-system",
                container="falco",
                follow=True,
                since_seconds=15
            ):
                try:
                    if line.strip().startswith('{'):
                        alert = json.loads(line)
                        
                        if 'rule' in alert and 'output' in alert:
                            output_fields = alert.get("output_fields", {}) or {}
                            ns = output_fields.get("k8s.ns.name")
                            container_name = output_fields.get("container.name", "")
                            proc_name = output_fields.get("proc.name", "")

                            # Drop non-Kubernetes/host alerts to avoid external container noise.
                            if ns not in ALLOWED_NAMESPACES:
                                continue

                            # Filter known noisy postgres readiness probe false positives.
                            if (
                                alert.get("rule") == "Read sensitive file untrusted"
                                and "postgres" in container_name.lower()
                                and proc_name in {"pg_isready", "psql", "postgres"}
                            ):
                                continue

                            # Suppress known benign control-plane access from internal infra pods.
                            rule_name = alert.get("rule", "")
                            suppress = SUPPRESSED_RULES.get(rule_name)
                            if suppress:
                              c_lower = container_name.lower()
                              if any(token in c_lower for token in suppress.get("containers", set())):
                                continue

                            # Prevent replay storms after pod/forwarder restarts.
                            if is_duplicate_alert(alert):
                                continue

                            logger.info(f"🚨 Alert: {alert.get('rule')}")
                            
                            headers = {}
                            if IDS_INTERNAL_ALERT_TOKEN:
                              headers["X-IDS-Internal-Token"] = IDS_INTERNAL_ALERT_TOKEN
                            response = requests.post(IDS_API, json=alert, headers=headers, timeout=5)
                            if response.status_code == 200:
                                alerts_forwarded += 1
                                logger.info(f"✅ Forwarded to IDS (total: {alerts_forwarded})")
                            else:
                                alerts_errors += 1
                                logger.warning(f"Failed: {response.status_code}")
                except json.JSONDecodeError:
                    pass
                except Exception as e:
                    alerts_errors += 1
                    logger.error(f"Error: {e}")
        except Exception as e:
            forwarder_up = 0
            logger.error(f"Fatal error: {e}")
            time.sleep(10)
    
    if __name__ == "__main__":
        # Start metrics server in background
        metrics_thread = threading.Thread(target=run_metrics_server, daemon=True)
        metrics_thread.start()
        
        while True:
            try:
                forward_to_ids()
            except Exception as e:
                logger.error(f"Restarting due to: {e}")
                time.sleep(10)
---
apiVersion: v1
kind: Service
metadata:
  name: falco-forwarder
  namespace: falco-system
  labels:
    app: falco-forwarder
spec:
  selector:
    app: falco-forwarder
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco-forwarder-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: falco-forwarder-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: falco-forwarder-role
subjects:
- kind: ServiceAccount
  name: falco-forwarder
  namespace: falco-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-forwarder
  namespace: falco-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-forwarder
  namespace: falco-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: falco-forwarder
  template:
    metadata:
      labels:
        app: falco-forwarder
    spec:
      serviceAccountName: falco-forwarder
      containers:
      - name: forwarder
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install -q kubernetes requests
            python /scripts/forwarder.py
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        env:
        - name: IDS_INTERNAL_ALERT_TOKEN
          value: "change-me"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: scripts
        configMap:
          name: falco-forwarder-script
