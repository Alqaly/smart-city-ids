---
# Environmental Sensor Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: env-sensor
  namespace: smart-city
  labels:
    app: env-sensor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: env-sensor
  template:
    metadata:
      labels:
        app: env-sensor
    spec:
      containers:
      - name: env-sensor
        image: smart-city-ids/smart-city-service:latest
        imagePullPolicy: Never
        command: ["python"]
        args:
          - "/app/app.py"
        ports:
        - containerPort: 5000
        - containerPort: 4840
        env:
        - name: FLASK_ENV
          value: "production"
        - name: PORT
          value: "5000"
        - name: OPCUA_ENABLED
          value: "1"
        - name: OPCUA_ENDPOINT
          value: "opc.tcp://0.0.0.0:4840/env"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: code
          mountPath: /app
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: code
        configMap:
          name: env-sensor-code
      - name: tmp
        emptyDir: {}

---
# Environmental Sensor Service
apiVersion: v1
kind: Service
metadata:
  name: env-sensor-service
  namespace: smart-city
  labels:
    app: env-sensor
spec:
  selector:
    app: env-sensor
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP
  - name: opcua
    port: 4840
    targetPort: 4840
    protocol: TCP
  type: ClusterIP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: env-sensor-pdb
  namespace: smart-city
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: env-sensor

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: env-sensor-hpa
  namespace: smart-city
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: env-sensor
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

