---
# Traffic Camera Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-camera
  namespace: smart-city
  labels:
    app: traffic-camera
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traffic-camera
  template:
    metadata:
      labels:
        app: traffic-camera
    spec:
      containers:
      - name: traffic-camera
        image: smart-city-ids/smart-city-service:latest
        imagePullPolicy: Never
        command: ["python"]
        args:
          - "/app/app.py"
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        - name: PORT
          value: "5000"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: code
          mountPath: /app
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: code
        configMap:
          name: traffic-camera-code
      - name: tmp
        emptyDir: {}

---
# Traffic Camera Service
apiVersion: v1
kind: Service
metadata:
  name: traffic-camera-service
  namespace: smart-city
  labels:
    app: traffic-camera
spec:
  selector:
    app: traffic-camera
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
  type: ClusterIP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: traffic-camera-pdb
  namespace: smart-city
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: traffic-camera

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: traffic-camera-hpa
  namespace: smart-city
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traffic-camera
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

