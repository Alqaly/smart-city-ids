apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-api
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ids-api
  template:
    metadata:
      labels:
        app: ids-api
    spec:
      serviceAccountName: ids-service-account
      containers:
      - name: ids-api
        image: ids-api:latest
        imagePullPolicy: Never
        command: ["python", "-m", "uvicorn"]
        args:
          - "main:app"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: XAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ids-secrets
              key: xai-api-key
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ids-secrets
              key: openai-api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ids-secrets
              key: anthropic-api-key
              optional: true
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ids-secrets
              key: gemini-api-key
              optional: true
        - name: KIMI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ids-secrets
              key: kimi-api-key
              optional: true
        - name: IDS_INTERNAL_ALERT_TOKEN
          value: "change-me"
        envFrom:
        - configMapRef:
            name: ids-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "750m"
        startupProbe:
          httpGet:
            path: /
            port: 8000
          failureThreshold: 180
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 45
          periodSeconds: 20
          timeoutSeconds: 8
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 8
          failureThreshold: 10
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ids-api-pdb
  namespace: smart-city
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ids-api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ids-api-hpa
  namespace: smart-city
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ids-api
  minReplicas: 1
  # Demo-safe default: keep IDS API single-replica because dedup/rate-limit
  # state is currently in-memory per pod. Increase only after moving those
  # controls to shared state (e.g., Redis/Postgres-backed counters).
  maxReplicas: 1
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
