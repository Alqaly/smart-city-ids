apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-api
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ids-api
  template:
    metadata:
      labels:
        app: ids-api
    spec:
      serviceAccountName: ids-service-account
      containers:
      - name: ids-api
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            apt update >/dev/null 2>&1
            apt install -y curl >/dev/null 2>&1
            cd /app
            pip install --no-cache-dir -r requirements.txt
            exec python -m uvicorn main:app --host 0.0.0.0 --port 8000
        ports:
        - containerPort: 8000
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: ids-secrets
              key: groq-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ids-secrets
              key: openai-api-key
        envFrom:
        - configMapRef:
            name: ids-config
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1500m"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 60  # 10 minutes total
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
      volumes:
      - name: app-code
        configMap:
          name: ids-app-code
