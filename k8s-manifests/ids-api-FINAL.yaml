apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-api
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ids-api
  template:
    metadata:
      labels:
        app: ids-api
    spec:
      serviceAccountName: ids-service-account
      containers:
      - name: ids-api
        image: ids-api:latest
        imagePullPolicy: Never
        command: ["uvicorn"]
        args:
          - "main:app"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: XAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ids-secrets
              key: xai-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ids-secrets
              key: openai-api-key
        envFrom:
        - configMapRef:
            name: ids-config
        volumeMounts:
        - name: app-code
          mountPath: /app
        - name: app-static
          mountPath: /app/static
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "750m"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 60  # 10 minutes total
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
      volumes:
      - name: app-code
        configMap:
          name: ids-app-code
      - name: app-static
        configMap:
          name: ids-app-static
