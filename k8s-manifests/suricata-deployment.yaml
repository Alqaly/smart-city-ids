---
# Suricata ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: suricata-config
  namespace: monitoring
data:
  suricata.yaml: |
    %YAML 1.1
    ---
    
    af-packet:
      - interface: any
        cluster-id: 99
        cluster-type: cluster_flow
        defrag: yes

    outputs:
      - eve-log:
          enabled: yes
          filetype: regular
          filename: /var/log/suricata/eve.json
          types:
            - alert:
                payload: yes
                payload-buffer-size: 4kb
                payload-printable: yes
                packet: yes
                metadata: yes
            - anomaly:
                enabled: yes
            - http:
                extended: yes
            - dns:
                enabled: yes

---
# Suricata Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suricata
  namespace: monitoring
  labels:
    app: suricata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suricata
  template:
    metadata:
      labels:
        app: suricata
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: suricata
        image: jasonish/suricata:6.0.13
        imagePullPolicy: IfNotPresent
        command: ["suricata"]
        args: ["-c", "/etc/suricata/suricata.yaml", "-i", "any"]
        securityContext:
          runAsUser: 0
          capabilities:
            add:
              - NET_ADMIN
              - SYS_NICE
        volumeMounts:
        - name: config
          mountPath: /etc/suricata
        - name: logs
          mountPath: /var/log/suricata
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: suricata-config
      - name: logs
        emptyDir: {}

---
# Suricata Service
apiVersion: v1
kind: Service
metadata:
  name: suricata
  namespace: monitoring
spec:
  selector:
    app: suricata
  ports:
  - name: syslog
    port: 514
    protocol: UDP
  type: ClusterIP
