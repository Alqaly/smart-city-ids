apiVersion: v1
kind: Service
metadata:
  name: ids-api-metrics
  namespace: smart-city
  labels:
    app: ids-api
spec:
  selector:
    app: ids-api
  ports:
  - name: web
    port: 8000
    targetPort: 8000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ids-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: ids-api
  namespaceSelector:
    matchNames:
      - smart-city
  endpoints:
  - port: web
    path: /metrics
    interval: 10s
