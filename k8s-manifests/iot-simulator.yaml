apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-devices
  namespace: smart-city
  labels:
    app: iot-devices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iot-devices
  template:
    metadata:
      labels:
        app: iot-devices
        prometheus-scrape: "true" # For monitoring!
    spec:
      containers:
      - name: iot-sensor
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        # Install requirements and run the CLEAN main.py we moved earlier
        args:
          - |
            echo "🚀 Starting IoT Device Simulator..."
            pip install --no-cache-dir -r /app/requirements.txt
            python /app/main.py
        env:
        - name: DEVICE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MQTT_BROKER
          value: "mqtt-broker"
        - name: MQTT_PORT
          value: "1883"
        ports:
        - containerPort: 5000
          name: http
        volumeMounts:
        - name: code
          mountPath: /app
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: code
        configMap:
          name: iot-device-enhanced-code
---
apiVersion: v1
kind: Service
metadata:
  name: iot-devices
  namespace: smart-city
spec:
  selector:
    app: iot-devices
  ports:
  - port: 5000
    targetPort: 5000
    name: http
