apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-camera
  namespace: smart-city
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traffic-camera
  template:
    metadata:
      labels:
        app: traffic-camera
    spec:
      containers:
      - name: traffic-camera
        image: python:3.9-slim
        command: ["python", "-m", "http.server", "80"]
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-camera-service
  namespace: smart-city
spec:
  selector:
    app: traffic-camera
  ports:
  - port: 80
    targetPort: 80
---
