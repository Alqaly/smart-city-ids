apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-api
  namespace: smart-city
  labels:
    app: ids-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ids-api
  template:
    metadata:
      labels:
        app: ids-api
    spec:
      serviceAccountName: ids-service-account
      containers:
      - name: ids-api
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "🔥 LEGENDARY IDS STARTING..."
            apt update >/dev/null 2>&1
            apt install -y curl procps >/dev/null 2>&1
            
            cd /app
            echo "📦 Installing requirements..."
            pip install --upgrade pip >/dev/null 2>&1
            pip install --no-cache-dir -r requirements.txt
            
            echo "✅ IDS API READY — PORT 8000"
            exec python -m uvicorn main:app --host 0.0.0.0 --port 8000
        ports:
        - containerPort: 8000
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: ids-secrets
              key: groq-api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ids-secrets
              key: openai-api-key
        envFrom:
        - configMapRef:
            name: ids-config
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "750m"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
      volumes:
      - name: app-code
        configMap:
          name: ids-app-code
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ids-api-service
  namespace: smart-city
spec:
  selector:
    app: ids-api
  ports:
  - port: 8000
    targetPort: 8000
