apiVersion: apps/v1
kind: Deployment
metadata:
  name: attack-receiver
  namespace: smart-city
  labels:
    app: attack-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attack-receiver
  template:
    metadata:
      labels:
        app: attack-receiver
    spec:
      containers:
      - name: attack-receiver
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        # 1. Install deps from the clean requirements.txt
        # 2. Run the main.py we moved earlier
        args:
          - |
            echo "🚀 Starting Attack Receiver..."
            pip install --no-cache-dir -r /app/requirements.txt
            python /app/main.py
        ports:
        - containerPort: 5555
        env:
        # Connect it to the other services if needed
        - name: IDS_API_URL
          value: "http://ids-api:8000"
        volumeMounts:
        - name: code
          mountPath: /app
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: code
        configMap:
          name: attack-receiver-code
---
apiVersion: v1
kind: Service
metadata:
  name: attack-receiver
  namespace: smart-city
spec:
  selector:
    app: attack-receiver
  ports:
  - port: 5555
    targetPort: 5555
