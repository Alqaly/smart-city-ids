apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-broker
  namespace: smart-city
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-broker
  template:
    metadata:
      labels:
        app: mqtt-broker
        prometheus-scrape: "true"
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0
        ports:
        - containerPort: 1883
          name: mqtt
        - containerPort: 9001
          name: mqtt-ws
        - containerPort: 8080
          name: metrics
        volumeMounts:
        - name: mosquitto-config
          mountPath: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          tcpSocket:
            port: 1883
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 1883
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: mosquitto-config
        configMap:
          name: mosquitto-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: smart-city
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence false
    
    listener 9001
    protocol websockets
    allow_anonymous true
    
    # Metrics for monitoring
    listener 8080
    protocol http
    allow_anonymous true
    
    log_dest stdout
    log_type all
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-broker
  namespace: smart-city
spec:
  selector:
    app: mqtt-broker
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
  - name: mqtt-ws
    port: 9001
    targetPort: 9001
  - name: metrics
    port: 8080
    targetPort: 8080
