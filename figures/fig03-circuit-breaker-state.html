<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Figure 3: Circuit Breaker State Machine</title>
<style>
  body { margin: 0; padding: 40px; background: #fff; font-family: 'Segoe UI', Arial, sans-serif; }
  svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Figure 3: Circuit Breaker State Machine</text>

  <!-- ==================== CLOSED STATE ==================== -->
  <rect x="60" y="160" width="220" height="160" rx="20" ry="20" fill="#d5f5e3" stroke="#27ae60" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="170" y="195" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e8449">CLOSED</text>
  <line x1="100" y1="205" x2="240" y2="205" stroke="#27ae60" stroke-width="1"/>
  <text x="170" y="225" text-anchor="middle" font-size="11" fill="#2c3e50">Normal operation</text>
  <text x="170" y="242" text-anchor="middle" font-size="11" fill="#2c3e50">All requests pass through</text>
  <text x="170" y="259" text-anchor="middle" font-size="11" fill="#2c3e50">Track consecutive failures</text>
  <text x="170" y="280" text-anchor="middle" font-size="10" fill="#7f8c8d" font-style="italic">failure_count = 0</text>

  <!-- Initial state indicator (filled circle) -->
  <circle cx="40" cy="240" r="8" fill="#333"/>
  <line x1="48" y1="240" x2="58" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== OPEN STATE ==================== -->
  <rect x="370" y="160" width="220" height="160" rx="20" ry="20" fill="#fadbd8" stroke="#c0392b" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="480" y="195" text-anchor="middle" font-size="16" font-weight="bold" fill="#a93226">OPEN</text>
  <line x1="410" y1="205" x2="550" y2="205" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="225" text-anchor="middle" font-size="11" fill="#2c3e50">Fail-fast mode</text>
  <text x="480" y="242" text-anchor="middle" font-size="11" fill="#2c3e50">All requests rejected immediately</text>
  <text x="480" y="259" text-anchor="middle" font-size="11" fill="#2c3e50">Cooldown timer active</text>
  <text x="480" y="280" text-anchor="middle" font-size="10" fill="#7f8c8d" font-style="italic">timeout = 30 seconds</text>

  <!-- ==================== HALF_OPEN STATE ==================== -->
  <rect x="680" y="160" width="220" height="160" rx="20" ry="20" fill="#fef9e7" stroke="#f39c12" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="790" y="195" text-anchor="middle" font-size="16" font-weight="bold" fill="#b7950b">HALF_OPEN</text>
  <line x1="720" y1="205" x2="860" y2="205" stroke="#f39c12" stroke-width="1"/>
  <text x="790" y="225" text-anchor="middle" font-size="11" fill="#2c3e50">Test mode</text>
  <text x="790" y="242" text-anchor="middle" font-size="11" fill="#2c3e50">Allow single probe request</text>
  <text x="790" y="259" text-anchor="middle" font-size="11" fill="#2c3e50">Evaluate provider health</text>
  <text x="790" y="280" text-anchor="middle" font-size="10" fill="#7f8c8d" font-style="italic">max_probes = 1</text>

  <!-- ==================== TRANSITIONS ==================== -->

  <!-- CLOSED → OPEN (top arc) -->
  <path d="M 280 200 C 330 100, 370 100, 370 200" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="282" y="108" width="130" height="36" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="347" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">failures ≥ 5</text>
  <text x="347" y="138" text-anchor="middle" font-size="9.5" fill="#666">threshold exceeded</text>

  <!-- OPEN → HALF_OPEN (straight right) -->
  <line x1="590" y1="240" x2="678" y2="240" stroke="#f39c12" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="594" y="210" width="120" height="36" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="654" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#f39c12">30s elapsed</text>
  <text x="654" y="240" text-anchor="middle" font-size="9.5" fill="#666">cooldown expired</text>

  <!-- HALF_OPEN → CLOSED (bottom arc, success) -->
  <path d="M 680 320 C 580 440, 380 440, 280 320" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="390" y="408" width="180" height="36" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="480" y="422" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">test succeeds</text>
  <text x="480" y="438" text-anchor="middle" font-size="9.5" fill="#666">reset failure count → CLOSED</text>

  <!-- HALF_OPEN → OPEN (top arc, failure) -->
  <path d="M 680 180 C 630 80, 580 80, 590 160" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="596" y="68" width="130" height="36" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="661" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">test fails</text>
  <text x="661" y="98" text-anchor="middle" font-size="9.5" fill="#666">restart timer → OPEN</text>

  <!-- ==================== SELF-LOOPS ON CLOSED ==================== -->

  <!-- Success self-loop (left side) -->
  <path d="M 80 160 C 50 90, 130 70, 130 160" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>
  <text x="90" y="88" text-anchor="middle" font-size="9.5" fill="#27ae60">success →</text>
  <text x="90" y="100" text-anchor="middle" font-size="9.5" fill="#27ae60">reset count</text>

  <!-- Failure self-loop (right side) -->
  <path d="M 210 160 C 210 90, 270 90, 260 160" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="255" y="88" text-anchor="middle" font-size="9.5" fill="#e67e22">failure →</text>
  <text x="255" y="100" text-anchor="middle" font-size="9.5" fill="#e67e22">count++</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="60" y="465" width="840" height="40" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <circle cx="100" cy="485" r="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="112" y="489" font-size="10" fill="#555">Healthy</text>
  <circle cx="200" cy="485" r="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="212" y="489" font-size="10" fill="#555">Unavailable</text>
  <circle cx="320" cy="485" r="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="332" y="489" font-size="10" fill="#555">Probing</text>

  <line x1="430" y1="485" x2="460" y2="485" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468" y="489" font-size="10" fill="#555">State transition</text>

  <line x1="590" y1="485" x2="620" y2="485" stroke="#888" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="628" y="489" font-size="10" fill="#555">Self-loop (internal event)</text>

  <text x="810" y="489" font-size="10" fill="#999" font-style="italic">Per-provider instance</text>
</svg>
</body>
</html>
