# Prometheus Alerting Rules for Smart City IDS
# Apply with: kubectl apply -f prometheus-alerts.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: monitoring
  labels:
    app: prometheus
data:
  alerts.yml: |
    groups:
      # ============== RATE LIMITING ALERTS ==============
      - name: rate_limiting
        interval: 30s
        rules:
          - alert: RateLimitExceeded
            expr: increase(smartcity_ids_rate_limit_requests_total{result="rejected"}[5m]) > 10
            for: 1m
            labels:
              severity: warning
              component: api
            annotations:
              summary: "High rate of rejected requests"
              description: "More than 10 requests rejected due to rate limiting in the last 5 minutes. Current: {{ $value }}"

          - alert: RateLimitTokensLow
            expr: smartcity_ids_rate_limit_tokens_available < 5
            for: 30s
            labels:
              severity: warning
              component: api
            annotations:
              summary: "Rate limit tokens nearly exhausted"
              description: "Only {{ $value }} rate limit tokens remaining. May reject incoming requests."

      # ============== CIRCUIT BREAKER ALERTS ==============
      - name: circuit_breaker
        interval: 15s
        rules:
          - alert: CircuitBreakerOpen
            expr: smartcity_ids_circuit_breaker_state == 2
            for: 10s
            labels:
              severity: critical
              component: llm
            annotations:
              summary: "LLM Circuit Breaker OPEN"
              description: "Circuit breaker is OPEN for {{ $labels.engine }}. LLM service is unhealthy."

          - alert: CircuitBreakerHalfOpen
            expr: smartcity_ids_circuit_breaker_state == 1
            for: 30s
            labels:
              severity: warning
              component: llm
            annotations:
              summary: "LLM Circuit Breaker testing recovery"
              description: "Circuit breaker is HALF_OPEN for {{ $labels.engine }}. Testing if service recovered."

          - alert: LLMFailoverActive
            expr: increase(smartcity_ids_llm_requests_total{engine="xai-grok-4",result=~"error|exception|circuit_open"}[5m]) > 5
            for: 1m
            labels:
              severity: warning
              component: llm
            annotations:
              summary: "Primary LLM (xAI) failing, using fallback"
              description: "xAI Grok-4 has failed {{ $value }} times in 5 minutes. Falling back to OpenAI."

      # ============== REQUEST QUEUE ALERTS ==============
      - name: request_queue
        interval: 30s
        rules:
          - alert: RequestQueueHigh
            expr: smartcity_ids_request_queue_size > 80
            for: 1m
            labels:
              severity: warning
              component: api
            annotations:
              summary: "Request queue filling up"
              description: "Request queue at {{ $value }} items. Max is 100. May start rejecting requests."

          - alert: RequestQueueOverflow
            expr: increase(smartcity_ids_request_queue_rejected_total[5m]) > 0
            for: 0s
            labels:
              severity: critical
              component: api
            annotations:
              summary: "Requests rejected due to queue overflow"
              description: "{{ $value }} requests rejected because queue is full."

      # ============== PROTECTION BYPASS ALERTS ==============
      - name: security_protection
        interval: 15s
        rules:
          - alert: ProtectionBypassAttempt
            expr: increase(smartcity_ids_protection_bypass_attempts_total[5m]) > 0
            for: 0s
            labels:
              severity: critical
              component: security
            annotations:
              summary: "Protection bypass attempt detected"
              description: "Someone attempted to bypass protection for service {{ $labels.service }} with action {{ $labels.action }}."

          - alert: ProtectedServiceTargeted
            expr: increase(smartcity_ids_protected_service_hits_total[10m]) > 3
            for: 0s
            labels:
              severity: critical
              component: security
            annotations:
              summary: "Protected service under attack"
              description: "Protected service {{ $labels.service }} has been targeted {{ $value }} times in 10 minutes."

          - alert: HighSeverityAlertsSpike
            expr: increase(smartcity_ids_severity_total{severity=~"8|9|10"}[5m]) > 5
            for: 1m
            labels:
              severity: critical
              component: security
            annotations:
              summary: "High severity alert spike"
              description: "{{ $value }} critical severity (8+) alerts in the last 5 minutes."

      # ============== AUTHENTICATION ALERTS ==============
      - name: authentication
        interval: 30s
        rules:
          - alert: AuthenticationFailures
            expr: increase(smartcity_ids_auth_failures_total[5m]) > 5
            for: 1m
            labels:
              severity: warning
              component: security
            annotations:
              summary: "Multiple authentication failures"
              description: "{{ $value }} authentication failures in 5 minutes. Possible brute force attempt."

      # ============== LLM HEALTH ALERTS ==============
      - name: llm_health
        interval: 30s
        rules:
          - alert: AllLLMsFailing
            expr: |
              (
                increase(smartcity_ids_llm_requests_total{engine="xai-grok-4",result="success"}[5m]) == 0
                and
                increase(smartcity_ids_llm_requests_total{engine="openai",result="success"}[5m]) == 0
                and
                increase(smartcity_ids_llm_requests_total[5m]) > 0
              )
            for: 2m
            labels:
              severity: critical
              component: llm
            annotations:
              summary: "All LLM engines failing"
              description: "Both xAI Grok-4 and OpenAI are failing. Alert analysis degraded."

          - alert: LLMLatencyHigh
            expr: histogram_quantile(0.95, rate(smartcity_ids_llm_latency_seconds_bucket[5m])) > 10
            for: 2m
            labels:
              severity: warning
              component: llm
            annotations:
              summary: "LLM response time high"
              description: "95th percentile LLM latency is {{ $value }}s. Users may experience delays."

          - alert: LLMCacheNotWorking
            expr: |
              (
                increase(smartcity_ids_llm_cache_total{operation="hit"}[30m]) == 0
                and
                increase(smartcity_ids_llm_cache_total{operation="miss"}[30m]) > 10
              )
            for: 5m
            labels:
              severity: warning
              component: llm
            annotations:
              summary: "LLM cache not reducing load"
              description: "Cache has 0 hits in 30 minutes despite {{ $value }} misses. Cache may be ineffective."

      # ============== SYSTEM HEALTH ALERTS ==============
      - name: system_health
        interval: 30s
        rules:
          - alert: IDSAPIDown
            expr: up{job="ids-api"} == 0
            for: 1m
            labels:
              severity: critical
              component: api
            annotations:
              summary: "IDS API is down"
              description: "IDS API has been unreachable for 1 minute."

          - alert: AlertProcessingErrors
            expr: increase(smartcity_ids_alerts_processed_total{result="error"}[5m]) > 3
            for: 1m
            labels:
              severity: warning
              component: api
            annotations:
              summary: "Alert processing errors increasing"
              description: "{{ $value }} alert processing errors in 5 minutes."

          - alert: AlertProcessingLatencyHigh
            expr: histogram_quantile(0.95, rate(smartcity_ids_alert_processing_seconds_bucket[5m])) > 5
            for: 2m
            labels:
              severity: warning
              component: api
            annotations:
              summary: "Alert processing taking too long"
              description: "95th percentile processing time is {{ $value }}s."

      # ============== KUBERNETES AUTOMATION ALERTS ==============
      - name: kubernetes_automation
        interval: 30s
        rules:
          - alert: HighPodIsolationRate
            expr: increase(smartcity_ids_k8s_pods_isolated[10m]) > 5
            for: 1m
            labels:
              severity: warning
              component: automation
            annotations:
              summary: "High pod isolation rate"
              description: "{{ $value }} pods isolated in 10 minutes. Verify this is expected."

          - alert: AutomationActionsBlocked
            expr: increase(smartcity_ids_actions_blocked_total[5m]) > 10
            for: 1m
            labels:
              severity: info
              component: automation
            annotations:
              summary: "Many automation actions blocked"
              description: "{{ $value }} automated actions blocked by safety controls in 5 minutes."

          - alert: DryRunModeActive
            expr: smartcity_ids_automation_mode{mode="dry_run"} == 1
            for: 0s
            labels:
              severity: info
              component: automation
            annotations:
              summary: "IDS running in dry-run mode"
              description: "Automation is in dry-run mode. No actual K8s actions will be taken."
